
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: base(~{::content}, 'TodoApp-Mes tâches', 'mes-taches')}">

<div th:fragment="content" class="container py-4">

    <!-- Titre de la page -->
    <h1 class="mb-4">
        <i class="bi bi-list-check"></i> Mes tâches
    </h1>

    <!-- Messages flash -->
    <div th:if="${messageSucces != null}"
         class="alert alert-success"
         role="status"
         th:text="${messageSucces}">
    </div>

    <div th:if="${messageErreur != null}"
         class="alert alert-warning"
         role="alert"
         th:text="${messageErreur}">
    </div>

    <!-- Aucun utilisateur connecté -->
    <div th:if="${utilisateurActif == null}"
         class="alert alert-warning"
         role="alert">

        <i class="bi bi-exclamation-triangle"></i>
        Aucun utilisateur connecté.

        <a th:href="@{/login}" class="alert-link">
            Se connecter
        </a>
    </div>

    <!-- Affichage si un utilisateur est connecté -->
    <div th:if="${utilisateurActif != null}">

        <!-- Présentation de l'utilisateur -->
        <div class="alert alert-info">
            <i class="bi bi-person-circle"></i>
            Tâches de
            <strong th:text="${utilisateurActif.prenom + ' ' + utilisateurActif.nom}"></strong>
        </div>

        <!-- Ajout d'une tâche -->
        <div class="mb-4">
            <a th:href="@{/mes-taches/creer}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Créer une tâche
            </a>
        </div>

        <!-- Aucune tâche enregistrée -->
        <div th:if="${#lists.isEmpty(taches)}"
             class="alert alert-secondary">

            <i class="bi bi-info-circle"></i>
            Aucune tâche enregistrée pour cet utilisateur.
        </div>

        <!-- Tableau des tâches -->
        <div th:if="${not #lists.isEmpty(taches)}"
             class="card shadow-sm">

            <div class="card-header">
                <h2 class="h5 mb-0">
                    <i class="bi bi-card-checklist"></i>
                    Liste des tâches

                    <span class="badge text-bg-secondary"
                          th:text="${#lists.size(taches)}">
                    </span>
                </h2>
            </div>

            <div class="card-body">
                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead class="table-light">
                        <tr>
                            <th>Identifiant</th>
                            <th>Titre</th>
                            <th>Description</th>
                            <th>Date de création</th>
                            <th>Échéance</th>
                            <th>État</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="tache : ${taches}">

                            <td th:text="${tache.idTache}"></td>

                            <td th:text="${tache.titre}"></td>

                            <td th:text="${tache.description != null ? tache.description : '-'}"></td>

                            <td th:text="${tache.dateCreation != null ? #temporals.format(tache.dateCreation, 'dd/MM/yyyy HH:mm') : '-'}"></td>

                            <td th:text="${tache.dateEcheance != null ? #temporals.format(tache.dateEcheance, 'dd/MM/yyyy') : '-'}"></td>

                            <td>
                                <span class="badge"
                                      th:classappend="${tache.terminee} ? ' text-bg-success' : ' text-bg-warning'"
                                      th:text="${tache.terminee} ? 'Terminée' : 'En cours'">
                                </span>
                            </td>

                        </tr>
                        </tbody>

                    </table>

                </div>
            </div>
        </div>
    </div>
</div>

</html>
