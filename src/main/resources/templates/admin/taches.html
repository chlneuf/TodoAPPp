
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: base(~{::content}, 'TodoApp - Tâches', 'admin/taches')}">

<div th:fragment="content" class="container py-4">

    <h1 class="mb-4">
        <i class="bi bi-card-checklist"></i> Gestion des tâches
    </h1>

    <p class="text-muted">
        Liste de l'ensemble des tâches enregistrées dans l'application TodoApp.
    </p>

    <!-- Messages de confirmation et d'erreur -->
    <div th:if="${messageSucces}" class="alert alert-success"
         th:text="${messageSucces}"></div>

    <div th:if="${messageErreur}" class="alert alert-danger"
         th:text="${messageErreur}"></div>

    <!-- Bouton de création -->
    <div class="mb-3">
        <a th:href="@{/admin/taches/creer}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Créer une tâche
        </a>
    </div>

    <!-- Aucune tâche -->
    <div th:if="${#lists.isEmpty(listeTaches)}"
         class="alert alert-info" role="alert">
        <i class="bi bi-info-circle"></i>
        Aucune tâche enregistrée.
    </div>

    <!-- Tableau des tâches -->
    <div th:if="${not #lists.isEmpty(listeTaches)}"
         class="card shadow-sm">

        <div class="card-header">
            <h2 class="h5 mb-0">
                <i class="bi bi-list-task"></i>
                Liste des tâches

                <span class="badge text-bg-secondary"
                      th:text="${#lists.size(listeTaches)}"></span>
            </h2>
        </div>

        <div class="card-body">
            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead class="table-light">
                    <tr>
                        <th>Identifiant</th>
                        <th>Titre</th>
                        <th>Description</th>
                        <th>Utilisateur</th>
                        <th>Date de création</th>
                        <th>Échéance</th>
                        <th>État</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="tache : ${listeTaches}">

                        <td th:text="${tache.idTache}"></td>

                        <td th:text="${tache.titre}"></td>

                        <td th:text="${tache.description != null ? tache.description : '-'}"></td>

                        <td>
                            <i class="bi bi-person"></i>
                            <span th:text="${tache.utilisateur != null ? tache.utilisateur.prenom + ' ' + tache.utilisateur.nom : '-'}"></span>
                        </td>

                        <td th:text="${tache.dateCreation != null ? #temporals.format(tache.dateCreation, 'dd/MM/yyyy HH:mm') : '-'}"></td>

                        <td th:text="${tache.dateEcheance != null ? #temporals.format(tache.dateEcheance, 'dd/MM/yyyy') : '-'}"></td>

                        <td>
                            <span class="badge"
                                  th:classappend="${tache.terminee} ? 'text-bg-success' : 'text-bg-warning'"
                                  th:text="${tache.terminee} ? 'Terminée' : 'En cours'">
                            </span>
                        </td>

                        <!-- Actions -->
                        <td>
                            <a th:href="@{/admin/taches/{id}/modifier(id=${tache.idTache})}"
                               class="btn btn-sm btn-outline-primary mb-1">
                                <i class="bi bi-pencil"></i> Modifier
                            </a>

                            <a th:href="@{/admin/taches/{id}/supprimer(id=${tache.idTache})}"
                               class="btn btn-sm btn-outline-danger mb-1">
                                <i class="bi bi-trash"></i> Supprimer
                            </a>
                        </td>

                    </tr>
                    </tbody>

                </table>
            </div>
        </div>
    </div>

</div>
</html>
